# docker-compose.yml
version: "3.8"
services:
  ros_dev_env:
    container_name: "ros-dev-vm"
    image: "nvidia/cuda:12.5.1-runtime-ubuntu22.04"
    build: ./
    volumes:
      - ${ROS_PROJECT_PATH}:/ros2_ws/src/
    environment:
      - DISPLAY=novnc:0.0
    networks:
      - x11
    stdin_open: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    tty: true
  novnc:
    image: theasp/novnc:latest
    environment:
      - DISPLAY_WIDTH=2560
      - DISPLAY_HEIGHT=1440
    ports:
      - "8080:8080"
    networks:
      - x11
    restart: on-failure
networks:
  x11:
